name: cmp-pallets
services:
  web:
    image: cmp-pallets-web:local
    build:
      context: .
      args:
        CMP_ODOO_DB: cmpslu
    environment:
      CMP_ODOO_UPSTREAM: host.docker.internal:16069
      CMP_ODOO_DB: cmpslu
    ports:
      - "0.0.0.0:4180:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16777216,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
